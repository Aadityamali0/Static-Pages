<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="product.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <section class="container sproduct py-5">
        <div class="row g-5 align-items-start">
            <div class="col-lg-5 col-md-12 col-12">
                <img class="img-fluid main-img w-100 pb-1" src="../swiper/images.jpeg" alt="">
                <!-- small photos at the bottom of the product -->
                <div class="small-img-group">
                  <div class="small-img-col">
                    <img src="../swiper/images.jpeg" width="100%" class="small-img" alt="">
                  </div>
                  <div class="small-img-col">
                    <img src="../swiper/black.jpeg" width="100%" class="small-img" alt="">
                  </div>
                  <div class="small-img-col">
                    <img src="../swiper/images.jpeg" width="100%" class="small-img" alt="">
                  </div>
                  <div class="small-img-col">
                    <img src="../swiper/images.jpeg" width="100%" class="small-img" alt="">
                  </div>
                </div>
              </div>
              <div class="col-lg-6 col-md-12 col-12">
                <h6>Home / T-shirt</h6>
                <h3 class="py-4">Men's Jacket</h3>
                <h2>Rs. 1999 </h2>
                <select class="my-3">
                  <option>Select Size</option>
                  <option>XL</option>
                  <option>L</option>
                  <option>S</option>
                </select>
                <input type="number" value="1">
                <button class="buy-btn">Add To Cart</button>
                <h4 class="mt-5 mb-5">Product Details: </h4>
                <span>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Obcaecati alias distinctio consectetur possimus, culpa adipisci ex iste voluptates magnam, eligendi esse quasi ipsa omnis modi deleniti accusantium aperiam sapiente corrupti.</span>
              </div>
        </div>
    </section>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
